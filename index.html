<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Element Combo - 化学元素パズル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .element-node {
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s;
            cursor: pointer;
        }

        .element-node.selected {
            transform: scale(1.15);
            z-index: 20;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.95), inset 0 0 8px rgba(255, 255, 255, 0.7);
        }

        /* Smooth Slow Blink effect for Hints */
        @keyframes hintBlink {
            0%, 100% {
                box-shadow: 0 0 6px rgba(251, 191, 36, 0.4), inset 0 0 4px rgba(251, 191, 36, 0.3);
                border-color: #f59e0b;
                transform: scale(1);
                opacity: 0.95;
            }
            50% {
                box-shadow: 0 0 22px rgba(245, 158, 11, 0.95), inset 0 0 10px rgba(251, 191, 36, 0.7);
                border-color: #fbbf24;
                transform: scale(1.08);
                opacity: 1;
                z-index: 25;
            }
        }

        .hint-node {
            animation: hintBlink 1.6s infinite ease-in-out;
            z-index: 25 !important;
        }

        /* Excellent Banner Animation */
        @keyframes excellentPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-5deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1.1); opacity: 0; }
        }

        .excellent-banner {
            animation: excellentPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
        }

        /* Noble Gas Bomb Animation */
        @keyframes bombPulse {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(-10deg); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1.1); opacity: 0; }
        }

        .bomb-banner {
            animation: bombPulse 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
        }

        /* Bomb Beam Blast Effects */
        @keyframes laserBlastRow {
            0% { transform: scaleY(0); opacity: 0.9; }
            50% { transform: scaleY(1.4); opacity: 1; }
            100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes laserBlastCol {
            0% { transform: scaleX(0); opacity: 0.9; }
            50% { transform: scaleX(1.4); opacity: 1; }
            100% { transform: scaleX(0); opacity: 0; }
        }

        .bomb-beam-row {
            animation: laserBlastRow 0.6s ease-out forwards;
        }

        .bomb-beam-col {
            animation: laserBlastCol 0.6s ease-out forwards;
        }

        .grid-container {
            perspective: 1000px;
        }

        .board-rotate {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #connection-svg {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes hintBannerPop {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .hint-banner-anim {
            animation: hintBannerPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
    </style>

    <!-- Firebase App & Firestore Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration Setup
        let db = null;
        let auth = null;
        let currentUser = null;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'element-combo-default';

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.warn("Auth initialization error fallback to anonymous:", e);
                        try { await signInAnonymously(auth); } catch(err){}
                    }
                };
                initAuth();

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                });
            }
        } catch (e) {
            console.warn("Firebase not configured or initialization failed:", e);
        }

        // Leaderboard Firebase API
        window.saveLeaderboardScore = async function(playerName, scoreValue, diffKey) {
            if (!db || !auth) {
                // Fallback to localStorage if Firebase not initialized
                saveLocalScore(playerName, scoreValue, diffKey);
                return true;
            }

            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                // Strict Path Rule: /artifacts/{appId}/public/data/{collectionName}
                const rankingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(rankingsRef, {
                    name: playerName || '匿名元素マスター',
                    score: Number(scoreValue),
                    diff: diffKey,
                    timestamp: Date.now(),
                    userId: auth.currentUser ? auth.currentUser.uid : 'anon'
                });
                return true;
            } catch (err) {
                console.error("Firestore save error, fallback to local:", err);
                saveLocalScore(playerName, scoreValue, diffKey);
                return true;
            }
        };

        window.fetchLeaderboard = async function(diffKey) {
            if (!db) {
                return getLocalScores(diffKey);
            }

            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                // Rule 2: Simple query without orderBy/where compound queries, sort in JS
                const rankingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const snapshot = await getDocs(rankingsRef);
                
                let list = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data && data.diff === diffKey) {
                        list.push(data);
                    }
                });

                // Combine with local offline scores if any
                const localList = getLocalScores(diffKey);
                list = list.concat(localList);

                // Sort descending in memory
                list.sort((a, b) => b.score - a.score);
                return list.slice(0, 15);
            } catch (err) {
                console.error("Firestore fetch error, fallback to local:", err);
                return getLocalScores(diffKey);
            }
        };

        function saveLocalScore(name, score, diff) {
            try {
                const key = `element_combo_scores_${diff}`;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                existing.push({ name: name || '匿名元素マスター', score: Number(score), timestamp: Date.now() });
                existing.sort((a,b) => b.score - a.score);
                localStorage.setItem(key, JSON.stringify(existing.slice(0, 20)));
            } catch(e){}
        }

        function getLocalScores(diff) {
            try {
                const key = `element_combo_scores_${diff}`;
                return JSON.parse(localStorage.getItem(key) || '[]');
            } catch(e) {
                return [];
            }
        }
    </script>

    <!-- Game Script -->
    <script>

const GRID_SIZE = 6;
const EXCELLENT_SCORE_THRESHOLD = 400; 	
	
// SVG Helper for Benzene Regular Hexagon

        // --- Sound Controller ---
        class SoundController {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, duration = 0.1, type = 'sine') {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playSelectSound(pitchIndex) {
                this.init();
                const baseFreq = 300;
                const freq = baseFreq * Math.pow(1.06, pitchIndex);
                this.playTone(freq, 0.08, 'sine');
            }
            playMatchSound() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.15, 'triangle'), i * 60);
                });
            }
            playExcellentSound() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.22, 'square'), i * 75);
                });
            }
            playBombSound() {
                this.init();
                if (!this.ctx) return;
                // Heavy explosion sound sequence
                [180, 120, 90, 60, 40].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.3, 'sawtooth'), i * 50);
                });
                setTimeout(() => this.playTone(1200, 0.2, 'triangle'), 100);
            }
            playRotateSound() {
                this.init();
                this.playTone(220, 0.12, 'sawtooth');
            }
            playShuffleSound() {
                this.init();
                if (!this.ctx) return;
                [350, 450, 550, 650, 750].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.08, 'sine'), i * 40);
                });
            }
            playHintSound() {
                this.init();
                if (!this.ctx) return;
                [880, 1174.66, 1396.91].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.1, 'sine'), i * 80);
                });
            }
            playGameOverSound() {
                this.init();
                if (!this.ctx) return;
                [400, 350, 300, 220].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.25, 'sawtooth'), i * 150);
                });
            }
        }

        // --- Initial Operations ---
        function setDifficulty(diffKey) {
            currentDifficultyKey = diffKey;
            const diffConfig = DIFFICULTIES[diffKey];
            
            diffBadgeText.textContent = diffConfig.name;
            btnChangeDiff.className = `mt-0.5 text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1 transition border ${diffConfig.badgeClass}`;

        function initGame() {
            score = 0;
            isGameOver = false;
            updateScore(0);
            hasShuffled = false;
            updateShuffleButtonState();
            resetHintCooldown();
            clearHintDisplay();
            closeModal(modalGameOver);
            scoreSubmitMsg.classList.add('hidden');
            btnSubmitScore.disabled = false;
            btnSubmitScore.classList.remove('opacity-50');

            grid = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                grid[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    grid[r][c] = getRandomElement();
                }
            }
            renderBoard();

            setTimeout(checkGameOverCondition, 300);

        function updateShuffleButtonState() {
            if (hasShuffled) {
                btnShuffle.disabled = true;

                btnShuffle.disabled = false;
                shuffleBtnText.textContent = 'シャッフル (残り1回)';
            }
        }

        function shuffleBoard() {
            if (hasShuffled || isGameOver) return;
            hasShuffled = true;
            updateShuffleButtonState();
            sound.playShuffleSound();

            let flatGrid = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    flatGrid.push(grid[r][c]);
                }
            }

            for (let i = flatGrid.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flatGrid[i], flatGrid[j]] = [flatGrid[j], flatGrid[i]];
            }

            let idx = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    grid[r][c] = flatGrid[idx++];
                }
            }

            renderBoard();
            setTimeout(checkGameOverCondition, 300);
        }

        // --- Hint Search & Game Over Logic ---
        function resetHintCooldown() {
            if (hintCooldownTimer) clearInterval(hintCooldownTimer);
            hintCooldownSeconds = 0;
            btnHint.disabled = false;
            hintBtnText.textContent = 'ヒント';
        }

        function getMosaickedFormula(formula) {
            let chars = formula.split('');
            let candidates = [];
            for (let i = 0; i < chars.length; i++) {
                if (/[A-Za-z0-9₁₂₃₄₅₆₇₈₉₀]/.test(chars[i])) {
                    candidates.push(i);
                }
            }
            if (candidates.length === 0) return formula;
            
            let maskCount = Math.max(1, Math.floor(candidates.length * 0.45));
            let shuffled = [...candidates].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < maskCount; i++) {
                chars[shuffled[i]] = '?';
            }
            return chars.join('');
        }

        function getReactionFormula(recipe) {
            if (recipe.isNobleGasSpecial) {
                const sym = recipe.formula.includes('He') ? 'He' : 'Ne';
                return `3 ${sym} ➔ 💥【希ガスボム発動】`;
            }
            const compParts = Object.entries(recipe.composition).map(([sym, count]) => {
                const displaySym = sym === 'Ph' ? 'Ph' : sym;
                return count > 1 ? `${count}${displaySym}` : displaySym;
            });
            return `${compParts.join(' + ')} ➔ ${recipe.formula}`;
        }

        function showHintBanner(recipe) {
            if (!hintBannerContainer) return;
            hintBannerContainer.innerHTML = '';
        }

        function showHintInSelectionBar(recipe) {
            const hintTextEl = document.getElementById('hint-display-text');
            const placeholderEl = document.getElementById('selection-placeholder');
            const selectionContainer = document.getElementById('current-selection-container');
            if (!hintTextEl) return;

                } else {

                hintTextEl.innerHTML = hintMsg;

        function clearHintDisplay() {
            const hintTextEl = document.getElementById('hint-display-text');
            const placeholderEl = document.getElementById('selection-placeholder');
            const selectionContainer = document.getElementById('current-selection-container');
            
            if (hintTextEl) {

                placeholderEl.classList.remove('hidden');

            }
            document.querySelectorAll('.hint-node').forEach(n => n.classList.remove('hint-node'));
        }

        function triggerHint() {
            if (hintCooldownSeconds > 0 || isGameOver) return;

            const validMatch = findAnyValidMatchPath(grid);

            if (validMatch) {
                sound.playHintSound();
                clearHintDisplay();
                
                // Slow pulse on grid elements
                validMatch.path.forEach(cell => {
                    const selector = `.element-node[data-row="${cell.r}"][data-col="${cell.c}"]`;
                    const node = boardEl.querySelector(selector);
                    if (node) {
                        node.classList.add('hint-node');
                    }
                });

                // Display inside selection bar
                showHintInSelectionBar(validMatch.recipe);

                // Auto clear hint after 4.5s
                setTimeout(() => {
                    clearHintDisplay();
                }, 4500);

            } else {
                showScorePopup({r: 2, c: 2}, '消せる組み合わせがありません！回転/シャッフルを試してください');
            }

            startHintCooldown();
        }

        function startHintCooldown() {
            hintCooldownSeconds = 5;
            btnHint.disabled = true;
            hintBtnText.textContent = `ヒント (${hintCooldownSeconds}s)`;

            hintCooldownTimer = setInterval(() => {
                hintCooldownSeconds--;
                if (hintCooldownSeconds <= 0) {
                    clearInterval(hintCooldownTimer);
                    btnHint.disabled = false;
                    hintBtnText.textContent = 'ヒント';
                } else {
                    hintBtnText.textContent = `ヒント (${hintCooldownSeconds}s)`;
                }
            }, 1000);
        }

        function simulateRotatedGrid(inputGrid, direction) {
            const tempGrid = [];
            for (let r = 0; r < GRID_SIZE; r++) tempGrid[r] = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (direction === 'right') {
                        tempGrid[c][GRID_SIZE - 1 - r] = inputGrid[r][c];
                    } else {
                        tempGrid[GRID_SIZE - 1 - c][r] = inputGrid[r][c];
                    }
                }
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let emptyRow = GRID_SIZE - 1;
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (tempGrid[r][c] !== null) {
                        const val = tempGrid[r][c];
                        tempGrid[r][c] = null;
                        tempGrid[emptyRow][c] = val;
                        emptyRow--;
                    }
                }
            }
            return tempGrid;
        }

        function checkGameOverCondition() {
            if (isGameOver) return;

            if (findAnyValidMatchPath(grid)) return;

            const rightRotated = simulateRotatedGrid(grid, 'right');
            if (findAnyValidMatchPath(rightRotated)) return;

            const leftRotated = simulateRotatedGrid(grid, 'left');
            if (findAnyValidMatchPath(leftRotated)) return;

            const doubleRotated = simulateRotatedGrid(rightRotated, 'right');
            if (findAnyValidMatchPath(doubleRotated)) return;

            if (!hasShuffled) return;

            triggerGameOver();
        }

        function triggerGameOver() {
            isGameOver = true;
            sound.playGameOverSound();
            document.getElementById('gameover-score').textContent = score;
            document.getElementById('gameover-diff').textContent = DIFFICULTIES[currentDifficultyKey].name;
            openModal(modalGameOver);
        }

        function findAnyValidMatchPath(targetGrid) {
            const directions = [
                {r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1},
                {r:-1, c:-1}, {r:-1, c:1}, {r:1, c:-1}, {r:1, c:1}
            ];

            const matchesFound = [];
            let stepCount = 0;
            const MAX_STEPS = 3000;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (!targetGrid[r][c]) continue;
                    dfsSearch({r, c}, [{r, c}], [targetGrid[r][c]]);
                    if (matchesFound.length > 5 || stepCount >= MAX_STEPS) break;
                }
                if (matchesFound.length > 5 || stepCount >= MAX_STEPS) break;
            }

            function dfsSearch(curr, path, symbols) {
                stepCount++;
                if (stepCount >= MAX_STEPS) return;
                if (path.length > 18) return;

                const result = checkMatchedRecipe(symbols);
                if (result) {
                    matchesFound.push({ path: [...path], recipe: result.recipe });
                    return;
                }

                for (let dir of directions) {
                    if (stepCount >= MAX_STEPS || matchesFound.length > 5) break;

                    const nr = curr.r + dir.r;
                    const nc = curr.c + dir.c;
                    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && targetGrid[nr][nc]) {
                        const alreadyVisited = path.some(p => p.r === nr && p.c === nc);
                        if (!alreadyVisited) {
                            dfsSearch({r: nr, c: nc}, [...path, {r: nr, c: nc}], [...symbols, targetGrid[nr][nc]]);
                        }
                    }
                }
            }

            if (matchesFound.length > 0) {
                return matchesFound[Math.floor(Math.random() * matchesFound.length)];
            }
            return null;
        }

        function getRandomElement() {
            return elementWeightedPool[Math.floor(Math.random() * elementWeightedPool.length)];
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const symbol = grid[r][c];
                    const elData = ALL_ELEMENTS[symbol] || ALL_ELEMENTS.H;

                    const node = document.createElement('div');
                    node.dataset.row = r;
                    node.dataset.col = c;
                    node.className = `element-node relative flex flex-col items-center justify-center rounded-xl font-extrabold shadow-md border-2 ${elData.borderColor} bg-gradient-to-br ${elData.color} ${elData.textColor} pop-in py-1`;
                    
                    const valenceDisplay = `[${elData.valence ?? 0}]`;

                    if (elData.isBenzene) {
                        node.innerHTML = `
                            ${BENZENE_HEX_SVG}
                            <span class="text-[8px] opacity-90 font-bold leading-none mt-0.5">${elData.name}</span>
                            <span class="text-[8px] opacity-80 font-mono font-bold leading-none mt-0.5">${valenceDisplay}</span>
                        `;
                    } else if (elData.isNoble) {
                        node.innerHTML = `
                            <span class="text-xs leading-none tracking-tight font-black flex items-center gap-0.5">${symbol} <i class="fa-solid fa-burst text-[8px] text-amber-300"></i></span>
                            <span class="text-[8px] opacity-90 font-bold leading-none mt-0.5">${elData.name}</span>
                            <span class="text-[8px] opacity-80 font-mono font-bold leading-none mt-0.5">${valenceDisplay}</span>
                        `;
                    } else {
                        const symbolSize = symbol.length > 3 ? 'text-[10px]' : (symbol.length > 2 ? 'text-xs' : 'text-sm');
                        node.innerHTML = `
                            <span class="${symbolSize} leading-none tracking-tight">${symbol}</span>
                            <span class="text-[8px] opacity-80 font-normal leading-none mt-0.5">${elData.name}</span>
                            <span class="text-[8px] opacity-80 font-mono font-bold leading-none mt-0.5">${valenceDisplay}</span>
                        `;
                    }

                    boardEl.appendChild(node);
                }
            }
        }

        // --- Interactive Dragging ---
        function getCellFromCoordinates(x, y) {
            const nodes = document.querySelectorAll('.element-node');
            for (let node of nodes) {
                const rect = node.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return { r: parseInt(node.dataset.row), c: parseInt(node.dataset.col) };
                }
            }
            return null;
        }

        function isAdjacent(c1, c2) {
            const dr = Math.abs(c1.r - c2.r);
            const dc = Math.abs(c1.c - c2.c);
            return (dr <= 1 && dc <= 1) && !(dr === 0 && dc === 0);
        }

        function handlePointerDown(e) {
            if (isGameOver) return;
            sound.init();
            clearHintDisplay();

            isDragging = true;
            const cell = getCellFromCoordinates(e.clientX, e.clientY);
            if (cell) {
                selectedPath = [cell];
                sound.playSelectSound(0);
                updateSelectionUI();
            }
        }

        function handlePointerMove(e) {
            if (!isDragging || isGameOver) return;
            const cell = getCellFromCoordinates(e.clientX, e.clientY);
            if (!cell) return;

            const lastCell = selectedPath[selectedPath.length - 1];
            
            if (selectedPath.length > 1) {
                const secondLast = selectedPath[selectedPath.length - 2];
                if (secondLast.r === cell.r && secondLast.c === cell.c) {
                    selectedPath.pop();
                    sound.playSelectSound(selectedPath.length - 1);
                    updateSelectionUI();
                    return;
                }
            }

            const alreadySelected = selectedPath.some(p => p.r === cell.r && p.c === cell.c);
            if (!alreadySelected && isAdjacent(lastCell, cell)) {
                selectedPath.push(cell);
                sound.playSelectSound(selectedPath.length - 1);
                updateSelectionUI();
            }
        }

        function handlePointerUp() {
            if (!isDragging || isGameOver) return;
            isDragging = false;

            if (matchedRecipe && selectedPath.length > 0) {
                executeMatch(matchedRecipe);
            }

            clearSelection();
        }

        function clearSelection() {
            selectedPath = [];
            matchedRecipe = null;
            updateSelectionUI();
            document.querySelectorAll('.element-node').forEach(n => n.classList.remove('selected'));
        }

        function checkMatchedRecipe(pathSymbols) {
            const counts = {};
            pathSymbols.forEach(s => counts[s] = (counts[s] || 0) + 1);

            const modeConfig = DIFFICULTIES[currentDifficultyKey];
            const isOrganicOnlyMode = modeConfig.isOrganicOnly;

            // Noble Gas Bomb (He, Ne) -> 3 or more of same noble gas
            if (pathSymbols.length >= 3) {
                if (!isOrganicOnlyMode && pathSymbols.every(s => s === 'He')) {
                    return { recipe: ALL_RECIPES.find(r => r.formula.includes('He BOMB')), count: pathSymbols.length, isBomb: true };
                }
                if (!isOrganicOnlyMode && pathSymbols.every(s => s === 'Ne')) {
                    return { recipe: ALL_RECIPES.find(r => r.formula.includes('Ne BOMB')), count: pathSymbols.length, isBomb: true };
                }
            }

            const availableElements = modeConfig.elements;

            for (let recipe of ALL_RECIPES) {
                if (recipe.isNobleGasSpecial) continue;
                if (isOrganicOnlyMode && !recipe.isOrganic) continue;
                
                const comp = recipe.composition;
                const recipeKeys = Object.keys(comp);

                if (!recipeKeys.every(k => availableElements.includes(k))) continue;

                const countKeys = Object.keys(counts);
                if (recipeKeys.length !== countKeys.length) continue;

                let isMatch = true;
                for (let key of recipeKeys) {
                    if (counts[key] !== comp[key]) {
                        isMatch = false;
                        break;
                    }
                }

                if (isMatch) return { recipe, count: pathSymbols.length };
            }

            return null;
        }

        function updateSelectionUI() {
            document.querySelectorAll('.element-node').forEach(node => {
                const r = parseInt(node.dataset.row);
                const c = parseInt(node.dataset.col);
                if (selectedPath.some(p => p.r === r && p.c === c)) {
                    node.classList.add('selected');
                } else {
                    node.classList.remove('selected');
                }
            });

            drawSVGConnections();

            const pathSymbols = selectedPath.map(p => grid[p.r][p.c]);
            
            if (pathSymbols.length === 0) {
                const hintTextEl = document.getElementById('hint-display-text');
                if (!hintTextEl || hintTextEl.classList.contains('hidden')) {
                    selectionPlaceholder.classList.remove('hidden');
                }
                selectionNodesEl.classList.add('hidden');
                moleculeMatchName.classList.add('hidden');
                return;
            }

            // Hide hint text when user starts selecting elements
            const hintTextEl = document.getElementById('hint-display-text');
            if (hintTextEl) hintTextEl.classList.add('hidden');

            selectionPlaceholder.classList.add('hidden');
            selectionNodesEl.classList.remove('hidden');
            selectionNodesEl.innerHTML = '';

            pathSymbols.forEach((sym, idx) => {
                const node = document.createElement('span');
                const elData = ALL_ELEMENTS[sym] || ALL_ELEMENTS.H;
                node.className = `px-1.5 py-0.5 rounded text-[11px] font-bold text-white bg-slate-800 border flex items-center gap-0.5 ${elData.borderColor}`;
                
                if (elData.isBenzene) {
                    node.innerHTML = `${BENZENE_HEX_SVG_SMALL}<span>Ph</span>`;
                } else {
                    node.textContent = sym;
                }
                
                selectionNodesEl.appendChild(node);

                if (idx < pathSymbols.length - 1) {
                    const dot = document.createElement('span');
                    dot.className = 'text-[9px] text-slate-500';
                    dot.textContent = '•';
                    selectionNodesEl.appendChild(dot);
                }
            });

            const result = checkMatchedRecipe(pathSymbols);
            if (result) {
                matchedRecipe = result;
                moleculeMatchName.textContent = result.isBomb ? 
                    `💥 +${result.recipe.score} ${result.recipe.name}` : 
                    `+${result.recipe.score} ${result.recipe.name} (${result.recipe.formula})`;
                moleculeMatchName.classList.remove('hidden');
            } else {
                matchedRecipe = null;
                moleculeMatchName.classList.add('hidden');
            }
        }

        function drawSVGConnections() {
            svgEl.innerHTML = '';
            if (selectedPath.length < 2) return;

            const boardRect = boardEl.getBoundingClientRect();
            let points = [];

            selectedPath.forEach(p => {
                const selector = `.element-node[data-row="${p.r}"][data-col="${p.c}"]`;
                const node = boardEl.querySelector(selector);
                if (node) {
                    const rect = node.getBoundingClientRect();
                    const x = rect.left + rect.width / 2 - boardRect.left;
                    const y = rect.top + rect.height / 2 - boardRect.top;
                    points.push(`${x},${y}`);
                }
            });

            const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
            polyline.setAttribute('points', points.join(' '));
            polyline.setAttribute('fill', 'none');
            polyline.setAttribute('stroke', matchedRecipe?.isBomb ? '#f43f5e' : (matchedRecipe ? '#34d399' : '#38bdf8'));
            polyline.setAttribute('stroke-width', '5');
            polyline.setAttribute('stroke-linecap', 'round');
            polyline.setAttribute('stroke-linejoin', 'round');
            polyline.setAttribute('opacity', '0.85');
            svgEl.appendChild(polyline);
        }

        // --- Execution & Gravity & Noble Gas Bomb ---
        function executeMatch(matchResult) {
            const { recipe, isBomb } = matchResult;

            let matchScore = recipe.score;
            if (isBomb) {
                // Noble Gas Bomb Execution
                sound.playBombSound();
                showBombBanner(recipe.formula.includes('He') ? 'He' : 'Ne');

                const originCell = selectedPath[0]; // 起点セル
                triggerBombLaserEffect(originCell);

                // Collect all cells to remove: entire row + entire column + connected path
                const toRemove = new Set();
                for (let c = 0; c < GRID_SIZE; c++) toRemove.add(`${originCell.r},${c}`);
                for (let r = 0; r < GRID_SIZE; r++) toRemove.add(`${r},${originCell.c}`);
                selectedPath.forEach(p => toRemove.add(`${p.r},${p.c}`));

                matchScore += (toRemove.size - 3) * 30; // Bonus score for cleared cells
                updateScore(score + matchScore);

                showScorePopup(originCell, `💥 希ガスボム +${matchScore}`);

                toRemove.forEach(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    grid[r][c] = null;
                });

            } else {
                if (matchScore >= EXCELLENT_SCORE_THRESHOLD) {
                    sound.playExcellentSound();
                    showExcellentBanner();
                } else {
                    sound.playMatchSound();
                }

                updateScore(score + matchScore);

                const lastCell = selectedPath[selectedPath.length - 1];
                showScorePopup(lastCell, `+${matchScore} ${recipe.name}`);

                selectedPath.forEach(p => {
                    grid[p.r][p.c] = null;
                });
            }

            applyGravityAndRefill();
        }

        function triggerBombLaserEffect(cell) {
            const rowSelector = `.element-node[data-row="${cell.r}"]`;
            const colSelector = `.element-node[data-col="${cell.c}"]`;

            document.querySelectorAll(rowSelector).forEach(node => {
                node.style.boxShadow = '0 0 25px #f43f5e, inset 0 0 15px #f43f5e';
                node.style.borderColor = '#fb7185';
            });

            document.querySelectorAll(colSelector).forEach(node => {
                node.style.boxShadow = '0 0 25px #f43f5e, inset 0 0 15px #f43f5e';
                node.style.borderColor = '#fb7185';
            });
        }

        function showBombBanner(sym) {
            excellentContainer.innerHTML = '';

            const banner = document.createElement('div');
            banner.className = 'bomb-banner absolute top-1/2 left-1/2 px-6 py-2.5 rounded-2xl bg-gradient-to-r from-rose-600 via-pink-500 to-rose-600 text-white font-black text-2xl tracking-wider shadow-[0_0_35px_rgba(244,63,94,0.8)] border-2 border-white flex items-center gap-2 z-50';
            banner.innerHTML = `
                <i class="fa-solid fa-burst text-amber-300"></i>
                <span>希ガスボム (${sym}) 発動！</span>
                <i class="fa-solid fa-burst text-amber-300"></i>
            `;

            excellentContainer.appendChild(banner);

            setTimeout(() => banner.remove(), 1400);
        }

        function showExcellentBanner() {
            excellentContainer.innerHTML = '';

            const banner = document.createElement('div');
            banner.className = 'excellent-banner absolute top-1/2 left-1/2 px-6 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black text-2xl tracking-wider shadow-2xl border-2 border-white flex items-center gap-2 z-50';
            banner.innerHTML = `
                <i class="fa-solid fa-star text-slate-950"></i>
                <span>EXCELLENT!</span>
                <i class="fa-solid fa-star text-slate-950"></i>
            `;

            excellentContainer.appendChild(banner);

            setTimeout(() => banner.remove(), 1250);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreDisplay.textContent = score;
        }

        function showScorePopup(cell, text) {
            const selector = `.element-node[data-row="${cell.r}"][data-col="${cell.c}"]`;
            const node = boardEl.querySelector(selector);
            if (!node) return;

            const rect = node.getBoundingClientRect();
            const boardRect = boardEl.getBoundingClientRect();

            const popup = document.createElement('div');
            popup.className = 'absolute font-black text-xs text-emerald-300 bg-slate-900/95 border border-emerald-400 px-2.5 py-1 rounded-full shadow-lg pointer-events-none z-50 transition-all duration-700 transform -translate-x-1/2 -translate-y-1/2';
            popup.style.left = `${rect.left + rect.width / 2 - boardRect.left}px`;
            popup.style.top = `${rect.top + rect.height / 2 - boardRect.top}px`;
            popup.textContent = text;

            popupContainer.appendChild(popup);

            setTimeout(() => {
                popup.style.transform = 'translate(-50%, -100%) scale(1.1)';
                popup.style.opacity = '0';
            }, 50);

            setTimeout(() => popup.remove(), 750);
        }

        function applyGravityAndRefill() {
            for (let c = 0; c < GRID_SIZE; c++) {
                let emptyRow = GRID_SIZE - 1;
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (grid[r][c] !== null) {
                        grid[emptyRow][c] = grid[r][c];
                        if (emptyRow !== r) grid[r][c] = null;
                        emptyRow--;
                    }
                }
                for (let r = emptyRow; r >= 0; r--) {
                    grid[r][c] = getRandomElement();
                }
            }
            renderBoard();

            setTimeout(checkGameOverCondition, 300);
        }

        function rotateBoard(direction) {
            if (isGameOver) return;
            sound.playRotateSound();
            const newGrid = [];
            for (let r = 0; r < GRID_SIZE; r++) newGrid[r] = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (direction === 'right') {
                        newGrid[c][GRID_SIZE - 1 - r] = grid[r][c];
                    } else {
                        newGrid[GRID_SIZE - 1 - c][r] = grid[r][c];
                    }
                }
            }

            grid = newGrid;

            const angle = direction === 'right' ? 90 : -90;
            boardEl.style.transform = `rotate(${angle}deg)`;

            setTimeout(() => {
                boardEl.style.transition = 'none';
                boardEl.style.transform = 'rotate(0deg)';
                applyGravityAndRefill();
                setTimeout(() => {
                    boardEl.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                }, 50);
            }, 300);
        }

        // --- Leaderboard Modal Controller ---
        let selectedRankingDiff = 'normal';

        async function renderRankingList(diffKey) {
            selectedRankingDiff = diffKey;
            
            // Update Tab styles
            document.querySelectorAll('.ranking-tab').forEach(tab => {
                if (tab.dataset.diff === diffKey) {
                    tab.className = 'ranking-tab px-2.5 py-1 rounded-lg font-bold bg-amber-500 text-slate-950 shadow';
                } else {
                    tab.className = 'ranking-tab px-2.5 py-1 rounded-lg font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';
                }
            });

            const container = document.getElementById('ranking-list-container');
            container.innerHTML = `
                <div class="text-center py-8 text-xs text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-amber-400 text-lg mb-2"></i><br>
                    スコアデータを読み込み中...
                </div>
            `;

            let scores = [];
            if (window.fetchLeaderboard) {
                scores = await window.fetchLeaderboard(diffKey);
            }

            container.innerHTML = '';

            if (!scores || scores.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-xs text-slate-500">
                        まだスコア記録がありません。<br>プレイして最初の記録を作ろう！
                    </div>
                `;
                return;
            }

            scores.forEach((item, index) => {
                const rankNum = index + 1;
                let rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-800 text-slate-400 font-bold text-xs flex items-center justify-center">${rankNum}</span>`;
                
                if (rankNum === 1) {
                    rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center shadow-md"><i class="fa-solid fa-crown text-[10px]"></i></span>`;
                } else if (rankNum === 2) {
                    rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-slate-900 font-black text-xs flex items-center justify-center shadow-md">2</span>`;
                } else if (rankNum === 3) {
                    rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-700 text-amber-100 font-black text-xs flex items-center justify-center shadow-md">3</span>`;
                }

                const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString('ja-JP') : '';

                const el = document.createElement('div');
                el.className = `glass-panel p-2.5 rounded-xl border flex items-center justify-between ${
                    rankNum === 1 ? 'border-amber-400/60 bg-amber-500/10' : 'border-slate-800 bg-slate-900/60'
                }`;

                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        ${rankBadge}
                        <div>
                            <div class="text-xs font-bold text-slate-100">${escapeHtml(item.name || '匿名')}</div>
                            <div class="text-[9px] text-slate-500">${dateStr}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-black text-amber-400 font-mono">${item.score.toLocaleString()}</span>
                        <span class="text-[10px] text-slate-400"> pts</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // --- Modals UI ---
        function buildDifficultyModal() {
            const container = document.getElementById('diff-options-container');
            container.innerHTML = '';

            Object.values(DIFFICULTIES).forEach(diff => {
                const isSelected = diff.id === currentDifficultyKey;
                const btn = document.createElement('button');
                btn.className = `w-full p-3 rounded-xl border text-left transition flex items-center justify-between ${
                    isSelected ? 'bg-slate-800 border-cyan-400 ring-1 ring-cyan-400' : 'bg-slate-900/60 border-slate-700 hover:bg-slate-800'
                }`;

                btn.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded border ${diff.badgeClass}">${diff.name}</span>
                            <span class="text-xs text-slate-400 font-semibold">元素数: ${diff.elements.length}種</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1">${diff.desc}</p>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-cyan-400 text-base"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    setDifficulty(diff.id);
                    closeModal(document.getElementById('modal-diff'));
                });

                container.appendChild(btn);
            });
        }

        function buildRecipeModal() {
            const container = document.getElementById('recipe-list-container');
            const diffConfig = DIFFICULTIES[currentDifficultyKey];
            const isOrganicOnly = diffConfig.isOrganicOnly;

            document.getElementById('recipe-current-diff').textContent = diffConfig.name;
            container.innerHTML = '';

            const availableElements = diffConfig.elements;
            let count = 0;

            ALL_RECIPES.forEach(recipe => {
                const compKeys = recipe.composition ? Object.keys(recipe.composition) : [];
                let isPossible = recipe.isNobleGasSpecial ? 
                    (!isOrganicOnly && (recipe.formula.includes('He') ? availableElements.includes('He') : availableElements.includes('Ne'))) :
                    compKeys.every(k => availableElements.includes(k));

                if (isOrganicOnly && !recipe.isOrganic) {
                    isPossible = false;
                }

                if (isPossible) count++;

                const item = document.createElement('div');
                item.className = `glass-panel p-2.5 rounded-xl border flex items-center justify-between transition ${
                    isPossible ? 'border-slate-700/70 opacity-100' : 'border-slate-800/40 opacity-40 grayscale'
                }`;

                let compHtml = '';
                if (recipe.isNobleGasSpecial) {
                    const sym = recipe.formula.includes('He') ? 'He' : 'Ne';
                    compHtml = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">💥 ${sym} × 3 (希ガスボム)</span>`;
                } else {
                    compHtml = Object.entries(recipe.composition).map(([sym, num]) => {
                        const isB = sym === 'Ph';
                        const displaySym = isB ? `${BENZENE_HEX_SVG_SMALL}Ph` : sym;
                        return `<span class="text-xs font-bold text-slate-300 inline-flex items-center gap-0.5">${displaySym}${num > 1 ? `<sub class="text-[9px] text-cyan-400">${num}</sub>` : ''}</span>`;
                    }).join('<span class="text-[10px] text-slate-600 mx-1">+</span>');
                }

                item.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-slate-100">${recipe.name}</span>
                            <span class="text-xs font-semibold text-cyan-400 font-mono">${recipe.formula}</span>
                            ${recipe.isOrganic ? '<span class="text-[9px] px-1.5 py-0.2 bg-purple-500/20 text-purple-300 rounded border border-purple-500/30">有機</span>' : ''}
                            ${!isPossible ? '<span class="text-[9px] px-1.5 py-0.2 bg-slate-800 text-slate-500 rounded border border-slate-700">不可</span>' : ''}
                        </div>
                        <p class="text-[10px] text-slate-400 mt-0.5">${recipe.desc}</p>
                        <div class="mt-1 flex items-center gap-1">${compHtml}</div>
                    </div>
                    <div class="text-right pl-2">
                        <span class="text-xs font-black text-amber-400">+${recipe.score}</span>
                        ${recipe.score >= EXCELLENT_SCORE_THRESHOLD ? '<div class="text-[8px] font-bold text-amber-300 bg-amber-500/20 px-1 py-0.2 rounded border border-amber-400/30 mt-0.5">EXCELLENT</div>' : ''}
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('recipe-count-badge').textContent = `作成可能: ${count} / ${ALL_RECIPES.length} 種`;
        }

        function openModal(modalEl) {
            modalEl.classList.remove('hidden');
            setTimeout(() => modalEl.classList.remove('opacity-0'), 10);
        }

        function closeModal(modalEl) {
            modalEl.classList.add('opacity-0');
            setTimeout(() => modalEl.classList.add('hidden'), 200);
        }

        // --- Event Listeners ---
        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);

        document.getElementById('btn-rotate-left').addEventListener('click', () => rotateBoard('left'));
        document.getElementById('btn-rotate-right').addEventListener('click', () => rotateBoard('right'));
        btnShuffle.addEventListener('click', shuffleBoard);
        btnHint.addEventListener('click', triggerHint);
        document.getElementById('btn-reset').addEventListener('click', () => {
            initGame();
        });
        document.getElementById('btn-restart-gameover').addEventListener('click', () => {
            initGame();
        });

        // Submit Score for Leaderboard
        btnSubmitScore.addEventListener('click', async () => {
            const inputEl = document.getElementById('player-name-input');
            const name = inputEl.value.trim() || '匿名元素マスター';
            
            btnSubmitScore.disabled = true;
            btnSubmitScore.classList.add('opacity-50');

            if (window.saveLeaderboardScore) {
                await window.saveLeaderboardScore(name, score, currentDifficultyKey);
                scoreSubmitMsg.textContent = '✓ スコアをランキングに登録しました！';
                scoreSubmitMsg.classList.remove('hidden');
            }
        });

        // Ranking Modal
        document.getElementById('btn-ranking').addEventListener('click', () => {
            renderRankingList(currentDifficultyKey);
            openModal(modalRanking);
        });
        document.getElementById('btn-close-ranking').addEventListener('click', () => closeModal(modalRanking));

        document.getElementById('ranking-tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.ranking-tab');
            if (btn && btn.dataset.diff) {
                renderRankingList(btn.dataset.diff);
            }
        });

        // Modals Controls
        btnChangeDiff.addEventListener('click', () => {
            buildDifficultyModal();
            openModal(document.getElementById('modal-diff'));
        });
        document.getElementById('btn-close-diff').addEventListener('click', () => closeModal(document.getElementById('modal-diff')));

        document.getElementById('btn-recipes').addEventListener('click', () => {
            buildRecipeModal();
            openModal(document.getElementById('modal-recipes'));
        });
        document.getElementById('btn-close-recipes').addEventListener('click', () => closeModal(document.getElementById('modal-recipes')));

        window.addEventListener('resize', drawSVGConnections);

        // --- Initialize Default (NORMAL) Mode ---
        setDifficulty('normal');
    </script>
</body>
</html>
